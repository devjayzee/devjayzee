name: Activity card

# Renders the activity card from the contribution calendar and publishes it to
# the `output` branch, which the profile README links to. Daily, and whenever
# the renderer or this workflow changes.

on:
  push:
    branches: [main]
    paths: [".github/scripts/activity.mjs", ".github/workflows/activity.yml"]
  pull_request:
    paths: [".github/scripts/activity.mjs", ".github/workflows/activity.yml"]
  schedule:
    - cron: "17 16 * * *" # 00:17 in Manila
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity-card
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render the activity card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/activity.mjs dist
      - name: Publish to the output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity-dark.svg activity-light.svg
          git commit -q -m "Update the activity card"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
