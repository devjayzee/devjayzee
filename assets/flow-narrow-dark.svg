<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 614" width="480" height="614" role="img" aria-labelledby="t d"><title id="t">How a change moves through my agent team</title><desc id="d">How a change moves through my Claude Code team: I hand the lead a task; the architect plans it; a screen gets a mockup from the designer first; the test engineer writes the tests and they are seen failing; then the builder builds; QA checks the running app, a reviewer reads the diff and a security reviewer tries to abuse it, in parallel; a stop hook allows Done only with evidence.</desc><style>@font-face{font-family:"ArchivoD";src:url(data:font/woff2;base64,) format("woff2");font-weight:800}@font-face{font-family:"Plex";src:url(data:font/woff2;base64,) format("woff2");font-weight:400}.d{font-family:"ArchivoD","Archivo Narrow","Arial Narrow",sans-serif;font-weight:800}.b{font-family:"ArchivoB","Archivo",Arial,sans-serif;font-weight:400}.m{font-family:"Plex","IBM Plex Mono",ui-monospace,Menlo,monospace;font-weight:400}.m6{font-family:"Plex","IBM Plex Mono",ui-monospace,Menlo,monospace;font-weight:600}.num{font-variant-numeric:tabular-nums lining-nums}@media (prefers-reduced-motion: reduce){.motion{display:none}.still{display:inline}.pulse{animation:none}}</style><rect x="0.5" y="0.5" width="479" height="613" rx="2" fill="#0a0a0b" stroke="#212127"/><path d="M128.0 88.0 C128.0 103.0 128.0 103.0 128.0 118.0" fill="none" stroke="#5c626b" stroke-width="1.25"/><path d="M128.0 174.0 C128.0 189.0 128.0 189.0 128.0 204.0" fill="none" stroke="#5c626b" stroke-width="1.25"/><path d="M128.0 260.0 C128.0 275.0 128.0 275.0 128.0 290.0" fill="none" stroke="#5c626b" stroke-width="1.25"/><path d="M128.0 346.0 C128.0 364.0 95.3 364.0 95.3 382.0" fill="none" stroke="#5c626b" stroke-width="1.25"/><path d="M128.0 346.0 C128.0 364.0 240.0 364.0 240.0 382.0" fill="none" stroke="#5c626b" stroke-width="1.25"/><path d="M128.0 346.0 C128.0 364.0 384.7 364.0 384.7 382.0" fill="none" stroke="#5c626b" strok